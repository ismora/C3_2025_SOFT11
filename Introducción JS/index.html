<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/imc.css">
</head>
<body>
    
    <h1>Calculo de IMC</h1>
    <form input="text" class="peso">
        <div>
            <lable for="txtPeso">Ingrese su peso (Kg)</lable>
            <input type="number" id="txtPeso" min="0" max="200">
        </div>

        <div>
            <lable for="txtAltura">Ingrese su altura (mts)</lable>
            <input type="number" id="txtAltura" min="0" max="3">
        </div>
        
        <button type="button" id="btnCalcularIMC">Calcular IMC</button>
    </form>
    
    <fieldset>
            <legend> Información para calcular el IMC</legend> 
            <div>
                <label for="txtPeso">Peso en kilogramos:</label>
                <input type="number" id="txtPeso" step="0.3" min="0" max="100">
            </div>

            <div>
                <label for="txtEstatura">Estatura en metros:</label>
                <input type="number" id="txtEstatura">
            </div>

        <button type="button" id="btnCalcularIMC">Calcular IMC</button>

        </fieldset>

    <section id="sctResultadoIMC">   
        <h2>IMC</h2>
        <p> </p>

    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js"></script>

</body>
</html>
