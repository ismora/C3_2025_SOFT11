<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asociar certificación</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/usuario.css">
    <link rel="stylesheet" href="css/navbar.css">

</head>

<body>
    <div id="navbar-container"></div>     <!-- Contenedor para la barra de navegación -->

    <form>
        <div>
            <label for="sltUsuario">Usuario:</label>
            <select id="sltUsuario"></select>
            <!-- select: Lista desplegable, será autogenerada con los datos del servidor -->
        </div>

        <div>
            <label for="sltCertificacion">Certifiación:</label>
            <select id="sltCertificacion"></select>
        </div>

        <button type="button" id="btnAsociar">Asociar</button>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/load-navbar.js"></script>
    <script src="js/asociar-certificacion.js"></script>

</body>

</html>
